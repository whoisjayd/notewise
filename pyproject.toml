[project]
name = "notewise"
version = "1.4.0"
description = "Convert YouTube videos into AI-powered study notes with chapter support"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "whoisjayd", email = "contactjaydeepsolanki@gmail.com" }]
keywords = ["youtube", "study", "notes", "ai", "llm", "education", "transcript"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "litellm==1.83.13",
    "typer>=0.21.1",
    "rich>=13.9.4",
    "aiolimiter>=1.2.1",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "markdown>=3.10.2",
    "html2docx>=1.6.0",
    "python-docx>=1.2.0",
    "fpdf2>=2.8.7",
]

[project.urls]
Homepage = "https://github.com/whoisjayd/notewise"
Repository = "https://github.com/whoisjayd/notewise"
Issues = "https://github.com/whoisjayd/notewise/issues"
Documentation = "https://github.com/whoisjayd/notewise"

[project.scripts]
notewise = "notewise.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notewise"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyinstaller>=6.16.0",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.0",
    "bandit[toml]>=1.9.3",
    "deptry>=0.24.0",
    "ty>=0.0.24,<1",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "scripts"]
unsafe-fixes = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "I",   # isort
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
]
ignore = []
per-file-ignores = { "src/notewise/cli/_banner.py" = ["E501"] }

[tool.ruff.lint.isort]
known-first-party = ["notewise"]
force-single-line = false
lines-after-imports = 2
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
python-version = "3.10"
root = ["./src"]

[tool.ty.src]
include = ["src/notewise"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["src/notewise"]
omit = ["*/tests/*", "*/__pycache__/*"]
concurrency = ["thread"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
severity = "HIGH"
confidence = "HIGH"

[tool.deptry]
exclude = [
    ".venv",
    "build",
    "dist",
    "scripts",
    "tests",
]
