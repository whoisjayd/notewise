[project]
name = "yt-study"
version = "0.2.1"
description = "Convert YouTube videos into AI-powered study notes with chapter support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "whoisjayd", email = "contactjaydeepsolanki@gmail.com" }]
keywords = ["youtube", "study", "notes", "ai", "llm", "education", "transcript"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "youtube-transcript-api>=1.2.3",
    "pytubefix>=10.3.6",
    "litellm>=1.81.1",
    "typer>=0.21.1",
    "rich>=13.9.4",
]

[project.urls]
Homepage = "https://github.com/whoisjayd/yt-study"
Repository = "https://github.com/whoisjayd/yt-study"
Issues = "https://github.com/whoisjayd/yt-study/issues"
Documentation = "https://github.com/whoisjayd/yt-study/tree/main/wiki"

[project.scripts]
yt-study = "yt_study.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_study"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.0",
    "mypy>=1.19.1",
    "bandit[toml]>=1.9.3",
    "deptry>=0.24.0",
    "types-requests",
    "types-setuptools",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "scripts"]
unsafe-fixes = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "I",   # isort
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["yt_study"]
force-single-line = false
lines-after-imports = 2
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/yt_study"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["src/yt_study"]
omit = ["*/tests/*", "*/__pycache__/*"]
concurrency = ["thread"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "async def",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
severity = "HIGH"
confidence = "HIGH"

[tool.deptry]
exclude = [
    ".venv",
    "build",
    "dist",
    "scripts",
    "tests",
    "wiki",
]
