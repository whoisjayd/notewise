# Area Labels
area:cli:
  - changed-files:
      - any-glob-to-any-file:
          - src/yt_study/cli.py
          - src/yt_study/ui/**

area:core:
  - changed-files:
      - any-glob-to-any-file:
          - src/yt_study/pipeline/**
          - src/yt_study/config.py

area:llm:
  - changed-files:
      - any-glob-to-any-file:
          - src/yt_study/llm/**
          - src/yt_study/prompts/**

area:youtube:
  - changed-files:
      - any-glob-to-any-file:
          - src/yt_study/youtube/**

area:docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - wiki/**
          - '*.md'

area:tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**

area:devops:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - Dockerfile
