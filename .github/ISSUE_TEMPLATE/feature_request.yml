name: Feature Request
description: Propose an improvement or new capability
title: "[Feature]: "
labels: ["type:feature", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Strong feature requests include clear user value, scope, and examples.
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This request is for yt-study (not provider/API support policy).
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: Proposed CLI/API Usage
      description: Show examples of commands/options/output if applicable.
      placeholder: |
        yt-study process "..." --new-flag
        # Expected output...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives have you considered?
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Primary project area for this request.
      options:
        - area:core
        - area:youtube
        - area:llm
        - area:cli
        - area:docs
        - area:tests
        - area:devops
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - priority:low
        - priority:medium
        - priority:high
        - priority:critical
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and Impact
      description: Who benefits and what parts of the project would be affected?
