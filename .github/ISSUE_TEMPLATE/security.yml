name: Security Vulnerability
description: Public security issue template (non-sensitive reports only)
title: "[Security]: "
labels: ["type:security", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not disclose sensitive vulnerabilities publicly.
        For private reporting instructions, see [SECURITY.md](../../SECURITY.md).
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I understand this is a public issue and I have removed sensitive exploit details.
          required: true
  - type: textarea
    id: description
    attributes:
      label: High-level Description
      description: Non-sensitive summary only.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Potential Impact
      description: What risk does this issue introduce?
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Choose the closest impact level.
      options:
        - severity:high
        - severity:critical
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - priority:high
        - priority:critical
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Affected Components
      description: Files, commands, or workflows potentially affected.
      placeholder: src/notewise/config.py, .github/workflows/release.yml
  - type: input
    id: versions
    attributes:
      label: Affected Versions
      description: Version/tag/commit range if known.
      placeholder: <= v1.0.0
  - type: textarea
    id: mitigation
    attributes:
      label: Suggested Mitigation
      description: Optional remediation ideas.
    validations:
      required: true
