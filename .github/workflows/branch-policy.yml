name: Branch Policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  enforce-base-branch:
    name: Enforce base branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Close non-release PRs targeting main
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || pr.base.ref !== 'main' || pr.head.ref === 'dev') {
              core.info('No branch policy action required.');
              return;
            }

            const message = [
              'Closing this PR because the base branch policy was not followed.',
              '',
              '- Normal contribution PRs must target `dev`.',
              '- Only maintainer-managed release PRs may target `main`, and those must come from `dev`.',
              '',
              'Please retarget this work to `dev` and reopen from the correct base branch.',
              'See `CONTRIBUTING.md` for the full contribution workflow.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: message,
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed',
            });
