name: Stale

on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          days-before-stale: 180
          days-before-close: 28
          stale-issue-message: "This issue is stale because it has been open for 180 days with no activity. If it is still relevant, leave a comment with updated context and we will keep it open."
          stale-pr-message: "This PR is stale because it has been open for 180 days with no activity. If work is still active, leave a comment or push an update and it will stay open."
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "type:security,good-first-issue,help-wanted"
          exempt-pr-labels: "type:security"
