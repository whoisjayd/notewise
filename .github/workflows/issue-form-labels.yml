name: Issue Form Labels

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  apply-form-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Apply area/severity labels from issue form
        uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issue.number;
            const body = issue.body || "";

            function extractFieldValue(fieldName) {
              const escaped = fieldName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const regex = new RegExp(`### ${escaped}\\s*\\n\\n([\\s\\S]*?)(?=\\n### |$)`, "m");
              const match = body.match(regex);
              if (!match) return null;
              const value = match[1].trim().split("\n")[0].trim();
              return value || null;
            }

            const areaValue = extractFieldValue("Area");
            const severityValue = extractFieldValue("Severity");
            const priorityValue = extractFieldValue("Priority");

            const desired = new Set();
            if (areaValue && areaValue.startsWith("area:")) desired.add(areaValue);
            if (severityValue && severityValue.startsWith("severity:")) desired.add(severityValue);
            if (priorityValue && priorityValue.startsWith("priority:")) desired.add(priorityValue);

            const repoLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { owner, repo, per_page: 100 }
            );
            const repoLabelSet = new Set(repoLabels.map((l) => l.name));

            const currentIssueLabels = issue.labels.map((l) => l.name);
            const currentAreaSeverity = currentIssueLabels.filter(
              (name) =>
                name.startsWith("area:") ||
                name.startsWith("severity:") ||
                name.startsWith("priority:")
            );

            for (const label of currentAreaSeverity) {
              if (!desired.has(label)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    name: label,
                  });
                } catch (error) {
                  core.info(`Skipping remove for ${label}: ${error.message}`);
                }
              }
            }

            const toAdd = [...desired].filter(
              (label) => repoLabelSet.has(label) && !currentIssueLabels.includes(label)
            );

            if (toAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: toAdd,
              });
              core.info(`Added labels: ${toAdd.join(", ")}`);
            } else {
              core.info("No new area/severity labels to add.");
            }
