name: PR Gate

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change Classification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      website_changed: ${{ steps.classify.outputs.website_changed }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      app_changed: ${{ steps.classify.outputs.app_changed }}
      workflow_changed: ${{ steps.classify.outputs.workflow_changed }}
      packaging_changed: ${{ steps.classify.outputs.packaging_changed }}
      version_changed: ${{ steps.classify.outputs.version_changed }}
      docker_changed: ${{ steps.classify.outputs.docker_changed }}
      tooling_changed: ${{ steps.classify.outputs.tooling_changed }}
      hook_changed: ${{ steps.classify.outputs.hook_changed }}
      uncategorized_changed: ${{ steps.classify.outputs.uncategorized_changed }}
      run_quality: ${{ steps.classify.outputs.run_quality }}
      run_tests: ${{ steps.classify.outputs.run_tests }}
      run_package_build: ${{ steps.classify.outputs.run_package_build }}
      run_docker: ${{ steps.classify.outputs.run_docker }}
      run_website: ${{ steps.classify.outputs.run_website }}
      run_docs: ${{ steps.classify.outputs.run_docs }}
      run_hook_parity: ${{ steps.classify.outputs.run_hook_parity }}
      run_version_sync: ${{ steps.classify.outputs.run_version_sync }}
      run_workflow_hygiene: ${{ steps.classify.outputs.run_workflow_hygiene }}
      run_matrix: ${{ steps.classify.outputs.run_matrix }}
    steps:
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docs_changed:
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'SECURITY.md'
              - 'docs/**'
              - '**/*.md'
              - '**/*.mdx'
            website_changed:
              - 'website/**'
            workflow_changed:
              - '.github/workflows/**'
              - '.github/actions/**'
            app_changed:
              - 'src/**/*.py'
              - 'tests/**/*.py'
            packaging_changed:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'src/notewise/__init__.py'
              - 'scripts/install.sh'
              - 'scripts/install.ps1'
            version_changed:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'src/notewise/__init__.py'
              - 'website/src/lib/version.ts'
              - 'docs/index.mdx'
              - 'docs/llms.txt'
              - 'docs/llms-full.txt'
              - 'docs/skill.md'
              - 'tests/unit/cli/test_updater.py'
              - 'scripts/check_version_sync.py'
            docker_changed:
              - 'Dockerfile'
              - '.dockerignore'
            tooling_changed:
              - 'Makefile'
              - 'scripts/**/*.py'
            hook_changed:
              - '.pre-commit-config.yaml'
              - 'scripts/hooks/**'

      - name: Classify validation scope
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner_sync=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_BASE_REF" = "main" ] && [ "$PR_HEAD_REF" = "dev" ] && [ "$PR_HEAD_REPO" = "$REPOSITORY" ] && [ "$PR_AUTHOR" = "$REPOSITORY_OWNER" ]; then
            owner_sync=true
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            docs_changed="${{ steps.filter.outputs.docs_changed }}"
            website_changed="${{ steps.filter.outputs.website_changed }}"
            workflow_changed="${{ steps.filter.outputs.workflow_changed }}"
            app_changed="${{ steps.filter.outputs.app_changed }}"
            packaging_changed="${{ steps.filter.outputs.packaging_changed }}"
            version_changed="${{ steps.filter.outputs.version_changed }}"
            docker_changed="${{ steps.filter.outputs.docker_changed }}"
            tooling_changed="${{ steps.filter.outputs.tooling_changed }}"
            hook_changed="${{ steps.filter.outputs.hook_changed }}"
          else
            docs_changed=true
            website_changed=true
            workflow_changed=true
            app_changed=true
            packaging_changed=true
            version_changed=true
            docker_changed=true
            tooling_changed=true
            hook_changed=true
          fi

          if [ "$owner_sync" = true ]; then
            docs_changed=true
            website_changed=true
            workflow_changed=true
            app_changed=true
            packaging_changed=true
            version_changed=true
            docker_changed=true
            tooling_changed=true
            hook_changed=true
          fi

          docs_only=false
          if [ "$docs_changed" = true ] && [ "$website_changed" != true ] && [ "$workflow_changed" != true ] && [ "$app_changed" != true ] && [ "$packaging_changed" != true ] && [ "$docker_changed" != true ] && [ "$tooling_changed" != true ] && [ "$hook_changed" != true ]; then
            docs_only=true
          fi

          run_quality=false
          run_tests=false
          run_package_build=false
          run_docker=false
          run_website=false
          run_docs=false
          run_hook_parity=false
          run_workflow_hygiene=false
          run_version_sync=false
          run_matrix=false

          categorized_changed=false
          if [ "$docs_changed" = true ] || [ "$website_changed" = true ] || [ "$workflow_changed" = true ] || [ "$app_changed" = true ] || [ "$packaging_changed" = true ] || [ "$version_changed" = true ] || [ "$docker_changed" = true ] || [ "$tooling_changed" = true ] || [ "$hook_changed" = true ]; then
            categorized_changed=true
          fi

          uncategorized_changed=false
          if [ "$categorized_changed" != true ]; then
            uncategorized_changed=true
          fi

          if [ "$app_changed" = true ] || [ "$packaging_changed" = true ]; then
            run_quality=true
            run_tests=true
            run_package_build=true
            run_matrix=true
          fi

          if [ "$docker_changed" = true ] || [ "$packaging_changed" = true ]; then
            run_docker=true
          fi

          if [ "$website_changed" = true ]; then
            run_website=true
          fi

          if [ "$docs_changed" = true ]; then
            run_docs=true
          fi

          if [ "$tooling_changed" = true ]; then
            run_quality=true
          fi

          if [ "$workflow_changed" = true ] || [ "$hook_changed" = true ]; then
            run_hook_parity=true
          fi

          if [ "$workflow_changed" = true ]; then
            run_workflow_hygiene=true
          fi

          if [ "$packaging_changed" = true ] || [ "$tooling_changed" = true ] || [ "$version_changed" = true ]; then
            run_version_sync=true
          fi

          if [ "$uncategorized_changed" = true ]; then
            run_quality=true
            run_tests=true
            run_matrix=true
          fi

          {
            echo "docs_only=$docs_only"
            echo "docs_changed=$docs_changed"
            echo "website_changed=$website_changed"
            echo "app_changed=$app_changed"
            echo "workflow_changed=$workflow_changed"
            echo "packaging_changed=$packaging_changed"
            echo "version_changed=$version_changed"
            echo "docker_changed=$docker_changed"
            echo "tooling_changed=$tooling_changed"
            echo "hook_changed=$hook_changed"
            echo "uncategorized_changed=$uncategorized_changed"
            echo "run_quality=$run_quality"
            echo "run_tests=$run_tests"
            echo "run_package_build=$run_package_build"
            echo "run_docker=$run_docker"
            echo "run_website=$run_website"
            echo "run_docs=$run_docs"
            echo "run_hook_parity=$run_hook_parity"
            echo "run_workflow_hygiene=$run_workflow_hygiene"
            echo "run_version_sync=$run_version_sync"
            echo "run_matrix=$run_matrix"
          } >> "$GITHUB_OUTPUT"

  docs-only:
    name: Docs Only Fast Path
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report docs-only optimization
        run: echo "Docs-only PR detected. Heavy validation jobs were skipped by design."

  workflow-hygiene:
    name: Workflow Hygiene
    needs: changes
    if: needs.changes.outputs.run_workflow_hygiene == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  quality:
    name: Quality Checks
    needs: changes
    if: needs.changes.outputs.run_quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen
      - name: Enforce formatting
        run: uv run ruff format --check src/notewise tests scripts
      - name: Run linter
        run: uv run ruff check src/notewise tests scripts
      - name: Run ty
        run: uv run ty check src/notewise
      - name: Check dependencies with deptry
        run: uv run deptry src
      - name: Run Bandit
        run: uv run bandit -c pyproject.toml -r src/notewise --severity-level medium --confidence-level medium
      - name: Ensure version command starts successfully
        run: uv run notewise version

  version-sync:
    name: Version Sync
    needs: changes
    if: needs.changes.outputs.run_version_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify package version metadata stays aligned
        run: python scripts/check_version_sync.py

  tests:
    name: Unit + Integration Tests (coverage)
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen
      - name: Run tests with coverage
        run: uv run python -m pytest -q tests/unit tests/integration -n auto --dist=loadfile --cov=src/notewise --cov-fail-under=90 --cov-report=xml
      - name: Upload coverage reports to Codecov
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: whoisjayd/notewise

  matrix-tests:
    name: Unit Compatibility Matrix
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: ubuntu-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen
      - name: Run unit compatibility tests
        run: uv run python -m pytest -q tests/unit -n auto --dist=loadfile

  package-build:
    name: Package Build
    needs: changes
    if: needs.changes.outputs.run_package_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      - name: Build source and wheel distributions
        run: uv build

  docker-build:
    name: Docker Build
    needs: changes
    if: needs.changes.outputs.run_docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build Docker image without pushing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: notewise:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  website-validation:
    name: Website Validation
    needs: changes
    if: needs.changes.outputs.run_website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
          cache: true
      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile
      - name: Check website formatting
        working-directory: website
        run: bunx prettier --check .
      - name: Lint website
        working-directory: website
        run: bun run lint
      - name: Type-check website
        working-directory: website
        run: bunx tsc --noEmit
      - name: Build website
        working-directory: website
        run: bun run build

  docs-validation:
    name: Docs Validation
    needs: changes
    if: needs.changes.outputs.run_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse Mintlify docs config
        run: python -m json.tool docs/docs.json > /dev/null
      - name: Check docs custom JavaScript syntax
        run: node --check docs/umami.js

  hook-parity:
    name: Hook Config Validation
    needs: changes
    if: needs.changes.outputs.run_hook_parity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      - name: Validate pre-commit config
        run: uvx pre-commit validate-config

  ci-required:
    name: PR Gate Required
    needs:
      - changes
      - docs-only
      - workflow-hygiene
      - quality
      - version-sync
      - tests
      - package-build
      - docker-build
      - website-validation
      - docs-validation
      - hook-parity
      - matrix-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate downstream results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: meta["result"]
              for name, meta in needs.items()
              if meta["result"] in {"failure", "cancelled"}
          }

          if failed:
              print("Required PR gate jobs failed:", file=sys.stderr)
              for name, result in failed.items():
                  print(f"- {name}: {result}", file=sys.stderr)
              raise SystemExit(1)

          print("PR gate passed with expected skips and successes.")
          PY
