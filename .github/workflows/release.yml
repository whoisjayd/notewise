name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run CI checks
        run: make ci

  build:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Build executable
        shell: bash
        run: |
          # Create a launcher to avoid relative import issues in cli.py
          echo "from yt_study.cli import app; import sys; sys.exit(app())" > launcher.py
          uv run pyinstaller --onefile --name yt-study \
            --collect-all litellm \
            --collect-all pydantic \
            --paths src \
            launcher.py
      - name: Rename and Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist/release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/yt-study.exe dist/release/yt-study-windows.exe
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            mv dist/yt-study dist/release/yt-study-macos
          else
            mv dist/yt-study dist/release/yt-study-linux
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.os }}
          path: dist/release/*

  pypi-publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build wheel and sdist
        run: make build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: pypi-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd all-dist
          sha256sum * > ../SHA256SUMS.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-dist/*
            SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
