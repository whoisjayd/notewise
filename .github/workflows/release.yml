name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish from, such as v1.2.1
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

permissions:
  contents: read

jobs:
  release-sanity:
    name: Release Sanity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen
      - name: Verify package metadata and release tag
        run: uv run python scripts/check_version_sync.py --release-tag "${{ env.RELEASE_TAG }}"

  build-dist:
    name: Build Python Distribution
    needs: release-sanity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      - name: Build package
        run: uv build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  build-binaries:
    name: Build Binary (${{ matrix.artifact_name }})
    needs: release-sanity
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux
            archive_ext: tar.gz
          - os: macos-latest
            artifact_name: macos
            archive_ext: tar.gz
          - os: windows-latest
            artifact_name: windows
            archive_ext: zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen
      - name: Build standalone binary
        shell: pwsh
        run: |
          uv run pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name notewise `
            --collect-all litellm `
            --collect-all tiktoken `
            --collect-submodules tiktoken_ext `
            --collect-data notewise.ui `
            --paths src `
            src/notewise/__main__.py
      - name: Archive standalone binary
        shell: pwsh
        run: |
          $releaseTag = "${{ env.RELEASE_TAG }}"
          $artifactName = "${{ matrix.artifact_name }}"
          $archiveExt = "${{ matrix.archive_ext }}"
          $archName = "${{ runner.arch }}".ToLowerInvariant()
          $binaryName = if ("${{ runner.os }}" -eq "Windows") { "notewise.exe" } else { "notewise" }
          $archiveBase = "notewise-$releaseTag-$artifactName-$archName"

          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item "dist/$binaryName" "release/$binaryName"

          if ($archiveExt -eq "zip") {
            Compress-Archive -Path "release/$binaryName" -DestinationPath "release/$archiveBase.zip" -Force
          }
          else {
            tar -czf "release/$archiveBase.tar.gz" -C release $binaryName
          }
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.artifact_name }}
          path: release/*

  publish-pypi:
    name: Publish to PyPI
    needs: build-dist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/notewise
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Attest build artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: Publish GitHub Release
    needs:
      - build-dist
      - build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release sources
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download Python distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Download standalone binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          : > SHA256SUMS.txt
          {
            (
              cd dist
              sha256sum -- ./*
            )
            (
              cd release-assets
              sha256sum -- ./*
            )
            sha256sum -- scripts/install.sh scripts/install.ps1
          } >> SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.whl
            release-assets/*
            SHA256SUMS.txt
            scripts/install.sh
            scripts/install.ps1
