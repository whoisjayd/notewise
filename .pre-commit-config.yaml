default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^website/tsconfig\.json$
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        args: ["--fix", "--unsafe-fixes"]
        files: ^(src|tests|scripts)/.*\.py$
      - id: ruff-format
        files: ^(src|tests|scripts)/.*\.py$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "--severity-level", "high"]
        additional_dependencies: ["bandit[toml]"]
        types: [python]
        exclude: ^(tests/|scripts/)

  - repo: local
    hooks:
      - id: single-line-commit
        name: single-line commit message
        entry: scripts/hooks/check-single-line-commit.sh
        language: script
        stages: [commit-msg]
      - id: ty
        name: ty (src/notewise)
        entry: uv run ty check src/notewise
        language: system
        pass_filenames: false
        files: ^(src/notewise/.*\.py|pyproject\.toml|uv\.lock)$
      - id: deptry
        name: deptry (unused/missing dependencies)
        entry: uv run deptry src
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|pyproject\.toml|uv\.lock)$
      - id: website-lock
        name: website lockfile check
        entry: bun install --cwd website --frozen-lockfile
        language: system
        pass_filenames: false
        files: ^website/(package\.json|bun\.lock)$
      - id: website-lint
        name: website lint
        entry: bun run --cwd website lint
        language: system
        pass_filenames: false
        files: ^website/
      - id: website-typecheck
        name: website typecheck
        entry: bun --cwd website tsc --noEmit
        language: system
        pass_filenames: false
        files: ^website/
      - id: prettier
        name: prettier (website/root only)
        entry: python scripts/hooks/run-prettier.py
        language: system
        files: ^(website/.*\.(css|html|js|jsx|json|jsonc|md|mdx|ts|tsx|ya?ml)|README\.md|CONTRIBUTING\.md|AGENTS\.md|SECURITY\.md|\.github/workflows/.*\.ya?ml|\.pre-commit-config\.yaml)$
      - id: docs-json
        name: docs JSON parse
        entry: python -m json.tool docs/docs.json
        language: system
        pass_filenames: false
        files: ^docs/docs\.json$
      - id: docs-js-syntax
        name: docs JavaScript syntax
        entry: node --check docs/umami.js
        language: system
        pass_filenames: false
        files: ^docs/.*\.js$
      - id: pytest-fast
        name: pytest fast (pre-push)
        entry: uv run --no-sync python -m pytest tests -q -n auto --dist=loadfile
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|tests/.*\.py)$
        stages: [pre-push]
      - id: website-build
        name: website build (pre-push)
        entry: bun run --cwd website build
        language: system
        pass_filenames: false
        files: ^website/
        stages: [pre-push]
